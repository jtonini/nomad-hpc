# NØMAÐ Configuration File
# Copy to ~/.config/nomad/nomad.toml or /etc/nomad/nomad.toml

[general]
# Log level: debug, info, warning, error
log_level = "info"
# Data directory for database and models
data_dir = "~/.local/share/nomad"

[database]
# SQLite database filename (relative to data_dir) or absolute path.
# Default: nomad.db in data_dir.
# Examples:
#   path = "nomad.db"              # -> data_dir/nomad.db
#   path = "mydb.sqlite"           # -> data_dir/mydb.sqlite
#   path = "/var/lib/nomad/prod.db" # absolute, used as-is
path = "nomad.db"

# ============================================
# COLLECTORS
# ============================================

[collectors]
# Each collector is turned on or off in its own [collectors.<name>] table
# (enabled = true/false); see nomad.toml.example and `nomad collectors`.
# Collection interval in seconds
interval = 60

[collectors.disk]
# Filesystems to monitor
filesystems = ["/", "/home", "/scratch", "/localscratch"]
# Enable quota collection
quota_enabled = false

[collectors.slurm]
# SLURM partition to monitor (empty = all)
partitions = []

[collectors.gpu]
# Enable GPU monitoring (requires nvidia-smi)
enabled = true

[collectors.nfs]
# NFS mount points to monitor
mount_points = []

# ============================================
# CLOUD COLLECTORS
# ============================================
# Cloud collectors ingest metrics from cloud provider APIs and normalize
# them into the same schema as on-prem collectors. Everything downstream
# (analysis, TESSERA, alerting, dashboards) works unchanged.

[collectors.cloud.aws]
# Enable AWS CloudWatch metric collection (requires: pip install boto3)
enabled = false
# region = "us-east-1"
# profile = "research-account"
# account_alias = "research-aws"
# lookback_minutes = 10
# metric_period = 300
# collect_cost = false
# collect_cw_agent_metrics = true
# [collectors.cloud.aws.tag_filters]
# Environment = "research"

# ============================================
# ALERTS
# ============================================

[alerts]
# Enable alert system
enabled = true
# Minimum severity to dispatch: info, warning, critical
min_severity = "warning"
# A condition (a disk path, a mount, a node) is raised when it appears or
# gets worse, then reminded of every reminder_hours while it lasts.
reminder_hours = 24
# Not seen for this long, it has ended; seen again, it is raised again.
episode_gap_minutes = 60
# Only where alerts have no database to remember them in: the same alert
# is held back this long.
cooldown_minutes = 15

[alerts.thresholds.disk]
used_percent_warning = 80
used_percent_critical = 95
# Full within this many hours at the rate of the last forecast_window_hours
# ([collectors.disk], default 6).
full_within_hours_warning = 72
full_within_hours_critical = 24

[alerts.thresholds.nfs]
retrans_percent_warning = 1.0
retrans_percent_critical = 5.0
avg_rtt_ms_warning = 50
avg_rtt_ms_critical = 100

[alerts.thresholds.gpu]
memory_percent_warning = 90
temperature_warning = 80
temperature_critical = 90

[alerts.predictive]
# Disk fill forecasts (when: full_within_hours_* in [alerts.thresholds.disk]).
enabled = true

# Email notifications (optional)
[alerts.email]
enabled = false
smtp_server = "smtp.example.com"
smtp_port = 587
use_tls = true
# username = "user"
# password = "pass"
from_address = "nomad@example.com"
recipients = ["admin@example.com"]

# Slack notifications (optional)
[alerts.slack]
enabled = false
webhook_url = ""
channel = "#hpc-alerts"
username = "NØMAÐ"

# Generic webhook (optional)
[alerts.webhook]
enabled = false
url = ""
# auth_token = ""

# ============================================
# ML PREDICTION
# ============================================

[ml]
# Enable ML predictions
enabled = true
# Default training epochs
epochs = 100
# Models directory (relative to data_dir or absolute)
models_dir = "models"

[ml.learning]
# Continuous learning strategy: time, count, drift
strategy = "count"
# Retrain after N new jobs (for count strategy)
job_threshold = 100
# Retrain every N hours (for time strategy)
interval_hours = 6
# Minimum jobs required for training
min_jobs = 50

# ============================================
# DASHBOARD
# ============================================

[dashboard]
# Default host and port
host = "127.0.0.1"
port = 8050
# Enable ML risk panel
ml_panel = true

# ============================================
# SLURM INTEGRATION
# ============================================

[slurm]
# Path to SLURM commands (if not in PATH)
# bin_path = "/usr/bin"

[slurm.prolog]
# Real-time job scoring
enabled = false
# Risk threshold for logging (0.0 - 1.0)
risk_threshold = 0.7
# Log file for high-risk jobs
log_file = "/var/log/nomad/high_risk_jobs.log"

[energy]
# Energy consumption, waste, and carbon-footprint monitoring (nomad energy).
enabled = true

# Power estimation (used when DCGM power_draw_w is unavailable)
cpu_tdp_watts    = 150     # per-socket CPU TDP, watts
cores_per_socket = 32      # cores per socket, for per-core power
overhead_factor  = 1.3     # PUE-like multiplier (cooling, network, storage)

# Utilization assumptions (CPU energy is estimated, not metered)
cpu_assumed_util  = 0.4    # fraction of allocated CPU actually used
cpu_idle_fraction = 0.3    # idle draw of an unused core, as fraction of per-core TDP

# Carbon intensity
carbon_source = "epa_egrid"   # epa_egrid | iea | manual
carbon_region = "SRVC"        # eGRID subregion (Virginia); or country code if iea
# carbon_intensity_g_per_kwh = 380   # manual override; use with carbon_source = "manual"
