name = "rfdiffusion-backbone"
program = "RFdiffusion"
title = "One made-up protein backbone"
about = """
RFdiffusion designs one protein backbone of 50 residues from nothing, on a
GPU. It shows how a GPU job is asked for and runs, and what RFdiffusion
writes: a PDB file of the backbone (open it in a molecule viewer) and a .trb
file of its settings.
"""
licence = "open"
source = "Written for nomad (AGPL-3.0); RFdiffusion is BSD-licensed"
input = "practice.yaml"
files = ["practice.yaml"]
cpus = 4
mem = "16G"
gpus = 1
time = "00:30:00"
minutes = 2

[[look]]
file = "designs/practice_0.pdb"
what = "The backbone it designed (a PDB file)"

[[look]]
file = "practice-*.out"
what = "How long the design took"
match = "Finished design"

[recorded]                      # one real run, kept with the kit
site = "spydur"
date = "2026-11-09"
module = "rfdiffusion/latest"
partition = "gpunodes"
cpus = 4
gpus = 1
gpu = "NVIDIA A40"
runtime_s = 58
cpu_s = 77
cores_busy = 1.3
peak_mb = 5105
files = ["recorded/designs/practice_0.pdb", "recorded/practice-89549.out"]
