name = "amber-peptide"
program = "AMBER"
title = "A small peptide in water: 100 ps of it moving"
about = """
pmemd follows a small peptide (Ace-Ala-Nme) in a box of about 2,000 water
molecules for 100 ps at 300 K, on a GPU (or one CPU core, if you choose that:
then it takes much longer, which is the difference a GPU makes). md.out
shows the energies as it goes and, at the end, how fast it ran (ns/day). The
topology and starting structure were made once when the kit was built at your
site.
"""
licence = "academic"
licence_note = "Amber (pmemd) is free for non-commercial use under its own licence; AmberTools is open source."
source = "Made for nomad (AGPL-3.0) with AmberTools' tleap: ff14SB and TIP3P"
input = "md.in"
files = ["md.in", "peptide.prmtop", "peptide.rst7"]
cpus = 1
gpus = 1
mem = "2G"
time = "00:20:00"
minutes = 1

[[look]]
file = "md.out"
what = "The energies every 5,000 steps (TEMP(K) is the temperature); the last two lines are the run's average, and how much it varied"
match = "NSTEP ="

[[look]]
file = "md.out"
what = "How fast it ran"
match = "ns/day"

[recorded]                      # one real run (its output is kept at the site, not here)
site = "spydur"
date = "2026-11-09"
module = "amber/26"
partition = "gpunodes"
cpus = 1
gpus = 1
gpu = "NVIDIA A40"
runtime_s = 14
cpu_s = 13
cores_busy = 0.9
peak_mb = 488
files = []

[build]
module = "amber/26"
commands = [
  "export AMBER26_BIND=\"${AMBER26_BIND:+$AMBER26_BIND:}$PWD\"",
  "tleap -f leap.in > leap.log",
  "sander -O -i min.in -o min.out -p peptide.prmtop -c start.rst7 -r peptide.rst7",
]
makes = ["peptide.prmtop", "peptide.rst7"]
