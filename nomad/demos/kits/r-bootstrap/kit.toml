name = "r-bootstrap"
program = "R"
title = "A straight line through made-up data, and how sure its slope is"
about = """
An R script makes up 2,000 points around a straight line, fits the line, then
refits it 20,000 times on resampled data (a bootstrap) to see how much the
slope moves. Run it once on one core and once with the job's "8 cores" choice:
the output says how long the fits took each way, which is the point of
asking for more cores.
"""
licence = "open"
source = "Written for nomad (AGPL-3.0); R is GPL"
input = "bootstrap.R"
files = ["bootstrap.R"]
cpus = 1
mem = "2G"
time = "00:20:00"
minutes = 1

[[look]]
file = "bootstrap-*.out"
what = "What the script printed: the slope, and how long the fits took on how many cores"
match = "slope|bootstrap fits"

[[look]]
file = "bootstrap_slopes.pdf"
what = "A histogram of the 20,000 slopes"

[recorded]                      # one real run, kept with the kit
site = "spydur"
date = "2026-11-09"
module = "R/4.4.2"
partition = "condos"
cpus = 1
runtime_s = 29
cpu_s = 29
cores_busy = 1.0
peak_mb = 90
files = ["recorded/bootstrap-89548.out", "recorded/bootstrap_slopes.pdf"]
