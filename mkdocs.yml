site_name: NØMAÐ-HPC Documentation
site_url: https://jtonini.github.io/nomad-hpc/
site_description: Lightweight HPC monitoring, visualization, and predictive analytics
site_author: João Tonini

repo_url: https://github.com/jtonini/nomad-hpc
repo_name: jtonini/nomad-hpc

theme:
  name: material
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: quickstart.md
    - Setup Wizard: setup-wizard.md
    - System Install: system-install.md
    - Configuration: config.md
  - Features:
    - Dashboard: dashboard.md
    - GPU Monitoring: gpu.md
    - Educational Analytics: edu.md
    - Alerts: alerts.md
    - Interactive Sessions: interactive.md
    - Data Readiness: readiness.md
    - Diagnostics: diagnostics.md
    - Insight Engine: insights.md
    - System Dynamics: dynamics.md
    - Cloud Monitoring: cloud.md
    - Issue Reporting: issue.md
    - Infrastructure: infrastructure.md
  - Technical:
    - Developer Toolchain: dev.md
    - Architecture: ARCHITECTURE.md
    - Network Methodology: network.md
    - ML Framework: ml.md
    - Proficiency Scoring: proficiency.md
    - CLI Reference: cli.md
    - Reference System: reference.md
  - Development:
    - Contributing: CONTRIBUTING.md
    - Extending NØMAÐ: extending.md
    - Roadmap: ROADMAP.md
    - Changelog: changelog.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jtonini/nomad-hpc
    - icon: fontawesome/solid/paper-plane
      link: mailto:jtonini@richmond.edu

copyright: Copyright &copy; 2024-2026 João Tonini

# Custom fonts
extra_css:
  - stylesheets/extra.css
