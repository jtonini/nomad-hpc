site_name: NØMAÐ-HPC Documentation
site_url: https://jtonini.github.io/nomad-hpc/
site_description: Monitoring, diagnostics and plain-language guidance for research computing
site_author: João Tonini

repo_url: https://github.com/jtonini/nomad-hpc
repo_name: jtonini/nomad-hpc

theme:
  name: material
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: quickstart.md
    - Installation: installation.md
    - Setup Wizard: setup-wizard.md
    - System Install: system-install.md
    - Configuration: config.md
    - Collectors: collectors.md
    - Console Access: console.md
  - People and Labs:
    - For people who run jobs:
      - Sizing and Submitting: submit.md
      - Practice Runs: demos.md
      - My Files: files.md
      - Ask (Help Requests): help-requests.md
      - Weekly Notices: notices.md
      - Educational Analytics: edu.md
    - For faculty:
      - Lab Reports: lab-reports.md
      - Condo Reports: condo-reports.md
      - Lab Membership Check: lab-check.md
      - Account Requests: lab-accounts.md
  - Operations:
    - Alerts: alerts.md
    - Actions: actions.md
    - Infrastructure: infrastructure.md
    - Diagnostics: diagnostics.md
    - GPU Monitoring: gpu.md
    - Interactive Sessions: interactive.md
    - Storage Use: storage.md
    - Licenses: licenses.md
    - Policy Watch: policy_watch.md
    - Prometheus Metrics: metrics.md
    - nomad's Databases: databases.md
    - Data Readiness: readiness.md
    - Cloud Monitoring: cloud.md
  - Reports and Analysis:
    - Usage Report: usage-report.md
    - Impact: impact.md
    - Facts: facts.md
    - Insight Engine: insights.md
    - System Dynamics: dynamics.md
    - ML Framework: ml.md
    - Training the Model: ml-training.md
    - Proficiency Scoring: proficiency.md
    - Network Methodology: network.md
  - Reference:
    - CLI Reference: cli.md
    - All Commands: cli-commands.md
    - Architecture: ARCHITECTURE.md
    - Reference System: reference.md
    - Standalone Dashboard: dashboard.md
    - Issue Reporting: issue.md
  - Development:
    - Contributing: CONTRIBUTING.md
    - Developer Toolchain: dev.md
    - Extending NØMAÐ: extending.md
    - Changelog: changelog.md

validation:
  anchors: warn
  unrecognized_links: warn

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jtonini/nomad-hpc
    - icon: fontawesome/solid/paper-plane
      link: mailto:jtonini@richmond.edu

copyright: Copyright &copy; 2024-2026 João Tonini

# Custom fonts
extra_css:
  - stylesheets/extra.css
