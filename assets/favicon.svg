<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0d0d1a" rx="18"/>

  <!-- Cyan circuit: top tail + node -->
  <line x1="50" y1="33" x2="50" y2="22" stroke="#00BACF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="22" x2="68" y2="22" stroke="#00BACF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="68" cy="22" r="3.5" fill="#00BACF"/>

  <!-- Cyan circuit: bottom tail + node (rotational mirror) -->
  <line x1="50" y1="77" x2="50" y2="88" stroke="#00BACF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="88" x2="32" y2="88" stroke="#00BACF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="88" r="3.5" fill="#00BACF"/>

  <!-- Ø: white circle + diagonal slash -->
  <circle cx="50" cy="55" r="22" fill="none" stroke="#ffffff" stroke-width="3"/>
  <line x1="32" y1="40" x2="68" y2="70" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
